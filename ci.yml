name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e ".[test]"
      - run: python -m pytest -q
      - name: Smoke test of the experiment scripts (small, not the full protocol)
        run: |
          python experiments/run_simulation.py --seed 0 --reps 1 --folds 3 --out /tmp/smoke_sim.csv
          python experiments/run_pima.py --reps 1 --out-dir /tmp/smoke_pima
